[package]
name = "copilot-session-tui"
version = "0.33.1"
edition = "2021"
rust-version = "1.86"
description = "A TUI for managing GitHub Copilot CLI sessions"

# Off by default: the generator exists only to regenerate the README images from the
# real widgets, and shipped builds have no use for it.
[features]
screenshots = []

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
fuzzy-matcher = "0.3"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
semver = "1"
ureq = { version = "3", features = ["json"] }
ignore = "0.4"
# Session names contain emoji; measuring and cutting them safely needs real Unicode
# width and grapheme support. Both already ship as ratatui dependencies.
unicode-width = "0.2"
unicode-segmentation = "1"
sha2 = "0.10"
tempfile = "3"
fs4 = "1"
uuid = { version = "1", features = ["v4"] }
# Vendored to keep visual wrapping, cursor placement, and mouse hit-testing on the
# same word-boundary algorithm. Upstream 0.11.6 supports character wrapping only.
edtui = { path = "vendor/edtui", version = "0.11.6", default-features = false, features = ["mouse-support", "syntax-highlighting"] }
arboard = { version = "3.6.1", default-features = false }
portable-pty = "0.9"
vt100 = "0.16"
tui-term = "0.3"

[target.'cfg(windows)'.dependencies]
# Checking whether a PID is alive by shelling out to tasklist costs ~250 ms per call,
# which dominated startup. OpenProcess answers the same question in microseconds.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
